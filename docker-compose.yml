services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrikids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutrikids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrikids}
      POSTGRES_DB: ${POSTGRES_DB:-nutrikids}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - nutrikids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-nutrikids} -d $${POSTGRES_DB:-nutrikids}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  nutrikids_pgdata:
