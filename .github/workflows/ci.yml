name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR (Install, Lint, Format, Types, Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrikids
          POSTGRES_PASSWORD: nutrikids
          POSTGRES_DB: nutrikids
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DIRECT_URL: postgresql://nutrikids:nutrikids@localhost:5432/nutrikids?schema=public
      DATABASE_URL: postgresql://nutrikids_app:nutrikids_app@localhost:5432/nutrikids?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Set app role password
        run: PGPASSWORD=nutrikids psql -h localhost -U nutrikids -d nutrikids -c "ALTER ROLE nutrikids_app PASSWORD 'nutrikids_app'"

      - name: Run test suite
        run: pnpm test
